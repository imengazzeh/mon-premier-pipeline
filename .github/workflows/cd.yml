# .github/workflows/cd.yml

name: CD - GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./          # Publier tout le contenu depuis la racine
          publish_branch: gh-pages # Branch où seront les fichiers générés
          force_orphan: true       # Recréer l'historique de zéro
